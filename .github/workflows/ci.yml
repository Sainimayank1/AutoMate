# Every push to main and every pull request: format, lint, types, unit and e2e tests (against a
# throwaway Postgres), web tests and the production builds. Mirrors the local checks.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: automate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d automate_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # CI-only database in the job's own container; no real credentials anywhere.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/automate_test
      NODE_ENV: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Version from package.json "packageManager".
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Shared package and Prisma client
        run: pnpm --filter @automate/api codegen

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm -r lint

      - name: Types
        run: pnpm -r typecheck

      - name: API unit tests
        run: pnpm --filter @automate/api test

      - name: Migrate the test database
        run: pnpm --filter @automate/api prisma:deploy

      - name: API e2e tests
        run: pnpm --filter @automate/api test:e2e

      - name: Web tests
        run: pnpm --filter @automate/web test

      - name: Build
        run: pnpm -r build

  # Playwright against a production build of the web app and the API (local file storage).
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: automate_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d automate_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # CI-only values for a throwaway database and server; no real credentials anywhere.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/automate_e2e
      JWT_ACCESS_SECRET: ci-browser-e2e-access-secret-not-a-real-one-0001
      FRONTEND_URL: http://localhost:4173
      VITE_API_BASE_URL: http://localhost:3000/api/v1
      E2E_BASE_URL: http://localhost:4173
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Shared package and Prisma client
        run: pnpm --filter @automate/api codegen
      - name: Migrate
        run: pnpm --filter @automate/api prisma:deploy
      - name: Build
        run: pnpm --filter @automate/api build && pnpm --filter @automate/web build
      - name: Start the API and the web preview
        run: |
          pnpm --filter @automate/api start > api.log 2>&1 &
          pnpm --filter @automate/web preview --port 4173 --strictPort > web.log 2>&1 &
          npx --yes wait-on@8 -t 120000 http://localhost:3000/api/v1/health http://localhost:4173
      - name: Playwright browser
        run: pnpm --filter @automate/web exec playwright install --with-deps chromium
      - name: Browser tests
        run: pnpm --filter @automate/web test:e2e
      - name: Server logs
        if: failure()
        run: tail -n 100 api.log web.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report

  # The production Docker stack builds, migrates and serves (docs/deployment/self-hosting.md).
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Throwaway settings for this run
        run: |
          umask 077
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 32)"
            echo "JWT_ACCESS_SECRET=$(openssl rand -hex 32)"
          } > .env
      - name: Build and start the stack
        run: docker compose -f docker-compose.prod.yml up -d --build
      - name: Wait for the API through Caddy
        run: |
          for _ in $(seq 1 60); do
            curl -fsS http://localhost/api/v1/health && exit 0
            sleep 2
          done
          exit 1
      - name: Serve the web app
        run: curl -fsS http://localhost/garage | grep -q "<title>AutoMate</title>"
      - name: Logs
        if: failure()
        run: docker compose -f docker-compose.prod.yml logs --tail 100
      - name: Stop
        if: always()
        run: docker compose -f docker-compose.prod.yml down -v
