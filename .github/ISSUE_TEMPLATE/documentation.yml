name: Documentation
description: Something in the docs is wrong, unclear or missing.
title: "[Docs]: "
labels: [documentation]
body:
  - type: input
    id: page
    attributes:
      label: Which page?
      placeholder: e.g. README.md, docs/deployment/self-hosting.md
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What's wrong or missing?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested change
