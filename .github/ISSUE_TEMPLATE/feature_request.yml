name: Feature request
description: Suggest an idea or an improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe what you're trying to do and what gets in the way.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How you imagine it working.
    validations:
      required: true
  - type: textarea
    id: benefit
    attributes:
      label: Who benefits, and how?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: textarea
    id: context
    attributes:
      label: Anything else?
      description: Screenshots, examples from other apps, links.
