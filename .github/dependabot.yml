# Weekly dependency updates, grouped to keep the number of pull requests small.
# cooldown matches pnpm's minimumReleaseAge (7 days, pnpm-workspace.yaml), so updated lockfiles
# pass `pnpm install --frozen-lockfile` in CI.
version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories: ["/apps/api", "/apps/web"]
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(docker)"
    ignore:
      # Node.js stays on an LTS line; move majors deliberately.
      - dependency-name: node
        update-types: [version-update:semver-major]

  - package-ecosystem: docker-compose
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(docker)"
    ignore:
      # A PostgreSQL major upgrade needs a dump and restore; never automatic.
      - dependency-name: postgres
        update-types: [version-update:semver-major]
